<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 520" width="100%" height="100%">
  <defs>
    <!-- Background subtle luxury vignette -->
    <radialGradient id="erLightBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </radialGradient>

    <!-- Deep Midnight Navy for Base E Letterform -->
    <linearGradient id="erNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#112240" />
      <stop offset="60%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#030c1b" />
    </linearGradient>

    <!-- Chrome Silver Flow Stream 1 (Top Wisp) -->
    <linearGradient id="erChromeTop" x1="0%" y1="0%" x2="100%" y2="25%">
      <stop offset="0%" stop-color="#64748b" stop-opacity="0.8" />
      <stop offset="20%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="75%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Chrome Silver Flow Stream 2 (Upper Mid) -->
    <linearGradient id="erChromeMid" x1="0%" y1="0%" x2="100%" y2="15%">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.6" />
      <stop offset="15%" stop-color="#94a3b8" />
      <stop offset="45%" stop-color="#ffffff" />
      <stop offset="80%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Chrome Silver Flow Stream 3 (Main Aerodynamic Coupe Body / Nosecone) -->
    <linearGradient id="erChromeMain" x1="0%" y1="0%" x2="100%" y2="5%">
      <stop offset="0%" stop-color="#64748b" stop-opacity="0.7" />
      <stop offset="18%" stop-color="#cbd5e1" />
      <stop offset="40%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#94a3b8" />
      <stop offset="88%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0a192f" />
    </linearGradient>

    <!-- Chrome Silver Flow Stream 4 (Lower Flow) -->
    <linearGradient id="erChromeBottom" x1="0%" y1="0%" x2="100%" y2="10%">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.5" />
      <stop offset="30%" stop-color="#cbd5e1" />
      <stop offset="60%" stop-color="#e2e8f0" />
      <stop offset="85%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0a192f" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- EMBLEM: Stylized "E" with Aerodynamic Streamlines (IMG_6570.jpeg) -->
  <g id="elite-ride-emblem" filter="url(#softShadow)" transform="translate(60, 20)">
    <!-- Base Navy "E" Form -->
    <!-- Top Horizontal Bar of "E" -->
    <path
      d="M 275 22 L 465 22 C 450 38, 418 52, 365 66 L 255 66 Z"
      fill="url(#erNavy)"
    />

    <!-- Slanted Spine of "E" -->
    <path
      d="M 268 66 L 315 66 L 225 258 L 180 258 Z"
      fill="url(#erNavy)"
    />

    <!-- Middle Crossbar of "E" -->
    <path
      d="M 245 162 L 380 162 L 368 192 L 230 192 Z"
      fill="url(#erNavy)"
    />

    <!-- Lower Horizontal Base Bar of "E" -->
    <path
      d="M 225 218 L 425 218 L 405 258 L 180 258 Z"
      fill="url(#erNavy)"
    />

    <!-- Dynamic Aerodynamic Wind Streamers / Metallic Speed Waves -->
    <!-- Wisp 1: Topmost speed stream -->
    <path
      d="M 85 88 C 135 56, 195 38, 272 32 C 342 26, 408 22, 465 22 C 412 34, 350 44, 280 52 C 210 60, 142 76, 85 88 Z"
      fill="url(#erChromeTop)"
    />

    <!-- Wisp 2: Upper streamline -->
    <path
      d="M 60 120 C 112 84, 182 64, 270 57 C 345 51, 412 55, 452 66 C 392 75, 320 80, 245 87 C 168 94, 108 110, 60 120 Z"
      fill="url(#erChromeMid)"
    />

    <!-- Wisp 3: Main prominent streamline forming vehicle aerodynamic nosecone & wingtip -->
    <path
      d="M 40 155 C 96 126, 172 104, 265 93 C 362 82, 448 93, 505 120 C 535 132, 550 137, 555 139 C 532 141, 482 144, 422 139 C 346 133, 260 137, 178 158 C 122 172, 76 182, 40 155 Z"
      fill="url(#erChromeMain)"
    />

    <!-- Wisp 4: Lower secondary airflow -->
    <path
      d="M 90 180 C 146 154, 218 142, 305 138 C 386 134, 462 140, 500 142 C 456 154, 390 161, 314 164 C 238 167, 162 180, 90 180 Z"
      fill="url(#erChromeBottom)"
    />

    <!-- Wisp 5: Bottom accent wave -->
    <path
      d="M 125 208 C 182 188, 254 178, 330 176 C 396 174, 452 179, 478 182 C 432 194, 368 200, 298 200 C 226 200, 172 210, 125 208 Z"
      fill="url(#erChromeMid)"
    />
  </g>

  <!-- WORDMARK: "ELITE RIDE" in bold navy geometric sans-serif -->
  <text
    x="325"
    y="380"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'Plus Jakarta Sans', Montserrat, 'Segoe UI', sans-serif"
    font-size="64"
    font-weight="900"
    letter-spacing="9"
    fill="#0a192f"
  >ELITE RIDE</text>

  <!-- TAGLINE: "Dominica's premier ride-sharing platform with real-time tracking" in royal blue serif -->
  <text
    x="325"
    y="445"
    text-anchor="middle"
    font-family="'Playfair Display', Georgia, Cambria, 'Times New Roman', serif"
    font-size="20"
    font-weight="400"
    letter-spacing="0.4"
    fill="#2563eb"
  >Dominica&apos;s premier ride-sharing platform with real-time tracking</text>
</svg>
